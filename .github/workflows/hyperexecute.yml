name: HyperExecute - Playwright 102

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  hyperexecute:
    runs-on: ubuntu-latest
    env:
      LT_USERNAME: ${{ secrets.LT_USERNAME }}
      LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Download HyperExecute CLI
        run: |
          curl -fsSL -o hyperexecute https://downloads.lambdatest.com/hyperexecute/linux/hyperexecute
          chmod +x hyperexecute

      - name: Run tests on HyperExecute
        run: |
          ./hyperexecute --user "$LT_USERNAME" --key "$LT_ACCESS_KEY" \
            --config hyperexecute.yaml \
            --download-artifacts --download-artifacts-path artifacts \
            --force-clean-artifacts

      - name: Upload HyperExecute artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hyperexecute-artifacts
          path: artifacts/
          if-no-files-found: ignore
