---
version: "0.1"
runson: ${matrix.os}

# Matrix: OS × Spec combinations create scenarios
matrix:
  os: [win, linux]
  spec:
    - tests/simple-form-demo.spec.ts
    - tests/drag-drop-slider.spec.ts
    - tests/input-form-submit.spec.ts

concurrency: 4
parallelism: 2
retryOnFailure: true
maxRetries: 1

globalTimeout: 90
testSuiteTimeout: 30
testSuiteStep: 30

jobLabel: [playwright-102, hyperexecute]
project:
  name: Playwright-102-TestMUAI

# Node 20
runtime:
  language: node
  version: "20"

# Environment variables
env:
  RUN_TARGET: hyperexecute
  CI: "true"
  BASE_URL: https://www.testmuai.com/selenium-playground/
  BUILD_NAME: Playwright-102-HyperExecute
  HEADLESS: "false"
  ENABLE_VIDEO: "true"
  ENABLE_SCREENSHOTS: "true"
  ENABLE_CONSOLE_LOGS: "true"
  ENABLE_NETWORK_LOGS: "true"
  LT_USERNAME: ${LT_USERNAME}
  LT_ACCESS_KEY: ${LT_ACCESS_KEY}

# Smart caching
cacheKey: '{{ checksum "package-lock.json" }}'
cacheDirectories:
  - node_modules

# Pre steps
pre:
  - node --version
  - npm install --no-audit --no-fund
  - npx playwright@1.55.0 install --with-deps

# Test discovery: find spec files to create scenarios
testDiscovery:
  type: raw
  mode: static
  command: find tests -name "*.spec.ts" -type f | sort

# Test runner command: $spec injected from matrix.spec
testRunnerCommand: node scripts/he-task.js $spec chromium

# Post steps
post:
  - node scripts/report-videos.js test-results
  - echo "Test execution completed"

# Artifacts
mergeArtifacts: true
uploadArtefacts:
  - name: playwright-report
    path:
      - playwright-report/**
  - name: test-results
    path:
      - test-results/**

# Reporting
report: true
partialReports:
  frameworkName: playwright
  location: playwright-report
  type: html

junit: true
resultFilePath: test-results/junit.xml
