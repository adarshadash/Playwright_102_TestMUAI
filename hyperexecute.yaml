---
version: "0.1"
runson: ${matrix.os}

# Matrix: OS × Spec = scenarios
# Each combination gets its own task
matrix:
  os: [win, linux]
  spec:
    - tests/simple-form-demo.spec.ts
    - tests/drag-drop-slider.spec.ts
    - tests/input-form-submit.spec.ts
concurrency: 4
parallelism: 2
retryOnFailure: true
maxRetries: 1

globalTimeout: 90
testSuiteTimeout: 30
testSuiteStep: 30

jobLabel: [playwright-102, hyperexecute]
project:
  name: Playwright-102-TestMUAI

# Node 20 on every VM (Playwright needs 20+; the default image Node is 18)
runtime:
  language: node
  version: "20"

# Injected environment variables (read by playwright.config.ts / tests via process.env)
env:
  RUN_TARGET: hyperexecute          # Local Chromium on HyperExecute VM (not cdp.lambdatest.com)
  CI: "true"
  BASE_URL: https://www.testmuai.com/selenium-playground/
  BUILD_NAME: Playwright-102-HyperExecute
  HEADLESS: "false"

  # Artifacts: video, screenshots, console logs, network logs (via traces)
  ENABLE_VIDEO: "true"
  ENABLE_SCREENSHOTS: "true"
  ENABLE_CONSOLE_LOGS: "true"
  ENABLE_NETWORK_LOGS: "true"

  # Secrets: retrieved from HyperExecute Secrets dashboard at runtime (never hard-coded)
  LT_USERNAME: ${LT_USERNAME}
  LT_ACCESS_KEY: ${LT_ACCESS_KEY}

# Dependency caching
cacheKey: '{{ checksum "package-lock.json" }}'
cacheDirectories:
  - node_modules

# Pre steps
pre:
  - node --version
  - npm install --no-audit --no-fund
  - npx playwright install chromium

# Test runner command: $spec injected from matrix.spec
# Matrix handles test discovery implicitly
testRunnerCommand: npx playwright test $spec --project=chromium

# Post steps (optional)
post:
  - echo Run finished

# Artifacts Management: collected from every VM and merged into one download per artifact
mergeArtifacts: true
uploadArtefacts:
  - name: playwright-report
    path:
      - playwright-report/**
  - name: test-results
    path:
      - test-results/**

report: true
partialReports:
  type: html
  location: playwright-report
  frameworkName: playwright
