version: 0.1
runson: ${matrix.target}
concurrency: 2
autosplit: true
retryOnFailure: true
maxRetries: 1
globalTimeout: 90
testSuiteTimeout: 30
testSuiteStep: 30
jobLabel: [playwright-102, ${matrix.target}]
project: Playwright-102-TestMUAI

# Two OS / browser combinations run in parallel: Windows 10 + Chrome and Linux + Chrome.
# `target` is exposed to commands as $target and selects the Playwright project (chrome-win / chrome-linux).
matrix:
  target: [win, linux]

# Injecting environment variables
env:
  BASE_URL: https://www.testmuai.com/selenium-playground/
  BUILD_NAME: Playwright-102-HyperExecute
  BROWSER_VERSION: latest
  HEADLESS: 'true'
  ENABLE_VIDEO: 'true'
  ENABLE_SCREENSHOTS: 'true'
  ENABLE_CONSOLE_LOGS: 'true'
  ENABLE_NETWORK_LOGS: 'true'

# Secrets Management: create LT_USERNAME and LT_ACCESS_KEY under HyperExecute > Secrets in the dashboard.
# They are never stored in the repo.
secrets:
  LT_USERNAME: ${{ .secrets.LT_USERNAME }}
  LT_ACCESS_KEY: ${{ .secrets.LT_ACCESS_KEY }}

# Dependency caching: node_modules is restored on later runs while package-lock.json is unchanged.
cacheKey: '{{ checksum "package-lock.json" }}'
cacheDirectories:
  - node_modules

# Pre steps
pre:
  - node --version
  - npm ci --no-audit --no-fund

# One test file per task, executed in parallel on every matrix target
testDiscovery:
  type: raw
  mode: dynamic
  command: grep -rlE "test\(" tests --include=*.spec.ts

testRunnerCommand: npx playwright test $test --project=chrome-$target

# Post steps (optional)
post:
  - echo "Run finished for $target"

# Artifacts Management: reports, videos, screenshots, traces and logs are collected from every
# environment and merged into one downloadable bundle on the dashboard.
mergeArtifacts: true
uploadArtefacts:
  - name: playwright-report
    path:
      - playwright-report/**
  - name: test-results
    path:
      - test-results/**

report: true
