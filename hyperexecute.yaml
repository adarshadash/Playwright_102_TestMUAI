---
version: "0.1"
runson: ${matrix.os}

# Simple 2-task setup: Windows and Linux, each running all tests in one execution
matrix:
  os: [win, linux]

concurrency: 4
parallelism: 2
retryOnFailure: true
maxRetries: 1

globalTimeout: 90
testSuiteTimeout: 30
testSuiteStep: 30

jobLabel: [playwright-102, hyperexecute]
project:
  name: Playwright-102-TestMUAI

# Node 20 on every VM (Playwright needs 20+)
runtime:
  language: node
  version: "20"

# Environment variables
env:
  RUN_TARGET: hyperexecute
  CI: "true"
  BASE_URL: https://www.testmuai.com/selenium-playground/
  BUILD_NAME: Playwright-102-HyperExecute
  HEADLESS: "false"

  # Artifacts: video, screenshots, console logs, network logs (via traces)
  ENABLE_VIDEO: "true"
  ENABLE_SCREENSHOTS: "true"
  ENABLE_CONSOLE_LOGS: "true"
  ENABLE_NETWORK_LOGS: "true"

  # Secrets: retrieved from HyperExecute Secrets dashboard at runtime
  LT_USERNAME: ${LT_USERNAME}
  LT_ACCESS_KEY: ${LT_ACCESS_KEY}

# Dependency caching
cacheKey: '{{ checksum "package-lock.json" }}'
cacheDirectories:
  - node_modules

# Pre steps
pre:
  - node --version
  - npm install --no-audit --no-fund
  - npx playwright install chromium

# Run all tests in one execution (no autosplit, no test discovery)
testRunnerCommand: npx playwright test --project=chromium

# Post steps
post:
  - echo "Tests completed"

# Artifacts Management
mergeArtifacts: true
uploadArtefacts:
  - name: playwright-report
    path:
      - playwright-report/**
  - name: test-results
    path:
      - test-results/**

report: true
partialReports:
  type: html
  location: playwright-report
  frameworkName: playwright

# JUnit result parsing based on exit code
junit: true
resultFilePath: test-results/junit.xml
