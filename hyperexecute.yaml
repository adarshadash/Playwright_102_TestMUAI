---
version: "0.1"
runson: ${matrix.os}

# Hybrid mode (autosplit + matrix) requires matrix.os, so it stays — but browsers run on the
# LambdaTest grid rather than on this VM, so the orchestrating OS does not affect the result.
# One cheap orchestrator OS, and the grid platform lives on its own axis.
#
# Two OS / browser combinations run in parallel: Windows 10 Chrome and macOS Monterey Chrome.
# 1 os x 2 platforms = 2 combinations, so each task opens exactly one grid session.
# Matrix + autosplit: each discovered spec file runs as its own task on every matrix target.
matrix:
  os: [linux]
  platform: [grid-chrome-win, grid-chrome-mac]
autosplit: true
concurrency: 4
parallelism: 2
retryOnFailure: true
maxRetries: 1

globalTimeout: 90
testSuiteTimeout: 30
testSuiteStep: 30

jobLabel: [playwright-102, hyperexecute]
project:
  name: Playwright-102-TestMUAI

# Node 20 on every VM (Playwright needs 20+; the default image Node is 18)
runtime:
  language: node
  version: "20"

# Injected environment variables (read by playwright.config.ts / tests via process.env)
env:
  RUN_TARGET: lt-grid               # Run on LambdaTest Playwright grid (cdp.lambdatest.com)
  CI: "true"
  BASE_URL: https://www.testmuai.com/selenium-playground/
  BUILD_NAME: Playwright-102-HyperExecute-LTGrid
  HEADLESS: "false"

  # Artifacts: video, screenshots, console logs, network logs (via traces)
  ENABLE_VIDEO: "true"
  ENABLE_SCREENSHOTS: "true"
  ENABLE_CONSOLE_LOGS: "true"
  ENABLE_NETWORK_LOGS: "true"

  # Secrets: retrieved from HyperExecute Secrets dashboard at runtime (never hard-coded)
  LT_USERNAME: ${LT_USERNAME}
  LT_ACCESS_KEY: ${LT_ACCESS_KEY}

# Dependency caching
cacheKey: '{{ checksum "package-lock.json" }}'
cacheDirectories:
  - node_modules

# Pre steps
pre:
  - node --version
  - npm install --no-audit --no-fund
  - npx playwright install chromium

# Test discovery: one spec file per task
testDiscovery:
  type: raw
  mode: dynamic
  command: node scripts/discover-tests.js

# $test = the spec file HyperExecute assigned to this task; $platform = this task's grid project
testRunnerCommand: npx playwright test $test --project=$platform

# Post steps (optional)
post:
  - echo Run finished

# Artifacts Management: collected from every VM and merged into one download per artifact
mergeArtifacts: true
uploadArtefacts:
  - name: playwright-report
    path:
      - playwright-report/**
  - name: test-results
    path:
      - test-results/**

report: true
partialReports:
  type: html
  location: playwright-report
  frameworkName: playwright