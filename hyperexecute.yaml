---
version: "0.1"
runson: ${matrix.os}

# Two browser/OS combinations run in parallel on the HyperExecute grid: Windows 10 Chromium and
# Linux Chromium. runson resolves to each matrix.os in turn, so the browser launches on a real
# Windows VM and a real Linux VM — the OS difference is the machine itself, not a remote capability.
# 2 os x 1 browser = 2 combinations, so each task launches exactly one browser.
# Matrix + autosplit: each discovered spec file runs as its own task on every matrix target.
matrix:
  os: [win, linux]
  browser: [chromium]
autosplit: true
concurrency: 4
parallelism: 2
retryOnFailure: true
maxRetries: 1

globalTimeout: 90
testSuiteTimeout: 30
testSuiteStep: 30

jobLabel: [playwright-102, hyperexecute]
project:
  name: Playwright-102-TestMUAI

# Node 20 on every VM (Playwright needs 20+; the default image Node is 18)
runtime:
  language: node
  version: "20"

# Injected environment variables (read by playwright.config.ts / tests via process.env)
env:
  RUN_TARGET: hyperexecute          # Launch the browser on the HE VM itself, never cdp.lambdatest.com
  CI: "true"
  BASE_URL: https://www.testmuai.com/selenium-playground/
  BUILD_NAME: Playwright-102-HyperExecute
  HEADLESS: "false"

  # Artifacts: video, screenshots, console logs, network logs (via traces)
  ENABLE_VIDEO: "true"
  ENABLE_SCREENSHOTS: "true"
  ENABLE_CONSOLE_LOGS: "true"
  ENABLE_NETWORK_LOGS: "true"

  # Secrets: retrieved from HyperExecute Secrets dashboard at runtime (never hard-coded)
  LT_USERNAME: ${LT_USERNAME}
  LT_ACCESS_KEY: ${LT_ACCESS_KEY}

# Dependency caching
cacheKey: '{{ checksum "package-lock.json" }}'
cacheDirectories:
  - node_modules

# Pre steps
pre:
  - node --version
  - npm install --no-audit --no-fund
  - npx playwright install chromium

# Test discovery: one spec file per task
testDiscovery:
  type: raw
  mode: dynamic
  command: node scripts/discover-tests.js

# $test = the spec file HyperExecute assigned to this task; $browser = this task's matrix browser.
# Wrapped so each task records into its own output directory: Playwright clears that directory
# on every invocation, so tasks sharing a VM would otherwise delete each other's videos.
testRunnerCommand: node scripts/he-task.js $test $browser

# Post steps (optional)
post:
  - node scripts/report-videos.js test-results
  - node scripts/archive-reports.js
  - echo Run finished

# Artifacts Management: collected from every VM and merged into one download per artifact
mergeArtifacts: true
uploadArtefacts:
  - name: playwright-report
    path:
      - playwright-report/**
  - name: test-results
    path:
      - test-results/**
  - name: he-reports
    path:
      - he-reports/**

report: true
partialReports:
  type: html
  location: playwright-report
  frameworkName: playwright

# Result file path: tells HyperExecute where to find test results for dashboard reporting
resultFilePath: test-results/junit.xml
