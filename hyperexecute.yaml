---
version: "0.1"

# Matrix: each combination creates a scenario
# os x spec = 6 scenarios (2 OS × 3 specs)
matrix:
  os: [win, linux]
  spec:
    - tests/simple-form-demo.spec.ts
    - tests/drag-drop-slider.spec.ts
    - tests/input-form-submit.spec.ts

runson: ${matrix.os}

concurrency: 4
parallelism: 2
retryOnFailure: true
maxRetries: 1

globalTimeout: 90
testSuiteTimeout: 30
testSuiteStep: 30

jobLabel: [playwright-102, hyperexecute]
project:
  name: Playwright-102-TestMUAI

# Node 20
runtime:
  language: node
  version: "20"

# Environment variables
env:
  RUN_TARGET: hyperexecute
  CI: "true"
  BASE_URL: https://www.testmuai.com/selenium-playground/
  BUILD_NAME: Playwright-102-HyperExecute
  HEADLESS: "false"
  ENABLE_VIDEO: "true"
  ENABLE_SCREENSHOTS: "true"
  ENABLE_CONSOLE_LOGS: "true"
  ENABLE_NETWORK_LOGS: "true"
  LT_USERNAME: ${LT_USERNAME}
  LT_ACCESS_KEY: ${LT_ACCESS_KEY}

# Dependency caching
cacheKey: '{{ checksum "package-lock.json" }}'
cacheDirectories:
  - node_modules

# Pre steps
pre:
  - node --version
  - npm install --no-audit --no-fund
  - npx playwright install chromium

# Test discovery: static list of test scenarios
testDiscovery:
  type: raw
  mode: static
  testPaths:
    - tests/simple-form-demo.spec.ts
    - tests/drag-drop-slider.spec.ts
    - tests/input-form-submit.spec.ts

# Test runner command: $spec is injected from matrix.spec
testRunnerCommand: npx playwright test $spec --project=chromium

# Post steps
post:
  - echo "Test completed"

# Artifacts
mergeArtifacts: true
uploadArtefacts:
  - name: playwright-report
    path:
      - playwright-report/**
  - name: test-results
    path:
      - test-results/**

report: true
partialReports:
  type: html
  location: playwright-report
  frameworkName: playwright

junit: true
resultFilePath: test-results/junit.xml
